name: Release

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Test
        run: task test-setup

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get timestamp
        id: timestamp
        run: echo "value=$(date +'%Y-%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          target: release
          push: true
          tags: |
            ghcr.io/dorossii/backend:latest
            ghcr.io/dorossii/backend:${{ steps.timestamp.outputs.value }}

    outputs:
      image_tag: ${{ steps.timestamp.outputs.value }}

  sync-infra:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          repository: dorossii/infra
          ref: main
          token: ${{ secrets.INFRA_REPO_PAT }}

      - name: Update image tag
        run: |
          sed -i -E "s#(ghcr\.io/dorossii/backend):[A-Za-z0-9._-]+#\1:${{ needs.build-and-push.outputs.image_tag }}#" docker-compose.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          git add docker-compose.yaml
          git commit -m "chore: bump backend image to ${{ needs.build-and-push.outputs.image_tag }}"
          git push origin HEAD:main

  deploy:
    runs-on: ubuntu-latest
    needs: sync-infra
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -fsS -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
