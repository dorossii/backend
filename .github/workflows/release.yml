name: Release

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Test
        run: task test-setup

      - name: Discord通知 (テスト成功)
        if: success()
        run: |
          curl -fsS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "✅ **テスト成功**\ncommit: \`${{ github.sha }}\`" '{content: $content}')"

      - name: Discord通知 (テスト失敗)
        if: failure()
        run: |
          curl -fsS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "❌ **テスト失敗**\ncommit: \`${{ github.sha }}\`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{content: $content}')"

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get timestamp
        id: timestamp
        run: echo "value=$(date +'%Y-%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          target: release
          push: true
          tags: |
            ghcr.io/dorossii/backend:latest
            ghcr.io/dorossii/backend:${{ steps.timestamp.outputs.value }}

      - name: Discord通知 (イメージpush成功)
        if: success()
        run: |
          curl -fsS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "📦 **イメージをGHCRへpushしました**\ntag: \`${{ steps.timestamp.outputs.value }}\`" '{content: $content}')"

      - name: Discord通知 (イメージpush失敗)
        if: failure()
        run: |
          curl -fsS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "❌ **イメージビルド/push失敗**\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{content: $content}')"

    outputs:
      image_tag: ${{ steps.timestamp.outputs.value }}

  sync-infra:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          repository: dorossii/infra
          ref: main
          token: ${{ secrets.INFRA_REPO_PAT }}

      - name: Update image tag
        run: |
          sed -i -E "s#(ghcr\.io/dorossii/backend):[A-Za-z0-9._-]+#\1:${{ needs.build-and-push.outputs.image_tag }}#" docker-compose.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          git add docker-compose.yaml
          git commit -m "chore: bump backend image to ${{ needs.build-and-push.outputs.image_tag }}"
          git push origin HEAD:main

      - name: Discord通知 (infra反映成功)
        if: success()
        run: |
          curl -fsS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "🔄 **infraリポジトリのイメージタグを更新しました**\ntag: \`${{ needs.build-and-push.outputs.image_tag }}\`" '{content: $content}')"

      - name: Discord通知 (infra反映失敗)
        if: failure()
        run: |
          curl -fsS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "❌ **infraリポジトリへの反映に失敗**\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{content: $content}')"

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, sync-infra]
    steps:
      - name: Discord通知 (デプロイ開始)
        run: |
          curl -fsS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "🚀 **サーバーへのデプロイを開始します**" '{content: $content}')"

      - name: Trigger deploy webhook
        run: |
          curl -fsS -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}"

      - name: デプロイ完了をヘルスチェックで確認
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ secrets.HEALTH_CHECK_URL }}" > /dev/null 2>&1; then
              echo "ヘルスチェック成功"
              exit 0
            fi
            echo "ヘルスチェック待機中... ($i/30)"
            sleep 10
          done
          echo "ヘルスチェックがタイムアウトしました"
          exit 1

      - name: Discord通知 (デプロイ成功)
        if: success()
        run: |
          curl -fsS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "✅ **デプロイ完了しました**\ntag: \`${{ needs.build-and-push.outputs.image_tag }}\`\nヘルスチェック確認済み" '{content: $content}')"

      - name: Discord通知 (デプロイ失敗)
        if: failure()
        run: |
          curl -fsS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "❌ **デプロイに失敗しました(ヘルスチェック未応答)**\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{content: $content}')"
